<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель администратора | BlueClinik</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-page: #F4F2EF;
            --card-bg: #FFFFFF;
            --primary-dark: #0A1C2F;
            --primary-medium: #1F3E5C;
            --accent: #C89F9F;
            --accent-light: #F1E6E6;
            --text-dark: #1A2C3A;
            --text-medium: #5D6F7F;
            --text-light: #919EAB;
            --success: #4CAF50;
            --warning: #FFA726;
            --danger: #EF5350;
            --shadow: 0 8px 28px -6px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 20px 32px -12px rgba(0, 0, 0, 0.12);
            --transition: all 0.3s ease;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-page);
            color: var(--text-dark);
        }

        .admin-header {
            background: var(--card-bg);
            box-shadow: var(--shadow);
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 40px;
        }

        .admin-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            text-decoration: none;
            color: var(--primary-dark);
        }

        .logo span {
            color: var(--accent);
        }

        .admin-badge {
            background: var(--accent-light);
            padding: 6px 16px;
            border-radius: 60px;
            font-size: 13px;
            font-weight: 600;
            color: var(--accent);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            font-weight: 500;
            border-radius: 60px;
            transition: var(--transition);
            cursor: pointer;
            border: none;
            font-size: 14px;
            text-decoration: none;
        }

        .btn-outline {
            background: transparent;
            border: 1.5px solid var(--primary-dark);
            color: var(--primary-dark);
        }

        .btn-outline:hover {
            background: var(--primary-dark);
            color: white;
        }

        .btn-primary {
            background: var(--primary-dark);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-medium);
            transform: translateY(-2px);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #c62828;
        }

        .btn-sm {
            padding: 6px 14px;
            font-size: 12px;
        }

        .admin-main {
            padding: 40px 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }

        .stat-icon {
            width: 56px;
            height: 56px;
            background: var(--accent-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: var(--accent);
        }

        .stat-info h3 {
            font-size: 28px;
            font-weight: 700;
        }

        .stat-info p {
            color: var(--text-medium);
            font-size: 14px;
        }

        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: var(--card-bg);
            border: none;
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            font-size: 15px;
            box-shadow: var(--shadow);
        }

        .tab-btn.active {
            background: var(--primary-dark);
            color: white;
        }

        .tab-pane {
            display: none;
        }

        .tab-pane.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .data-table {
            background: var(--card-bg);
            border-radius: 24px;
            overflow-x: auto;
            box-shadow: var(--shadow);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 16px 20px;
            text-align: left;
            border-bottom: 1px solid #E8E3DC;
        }

        th {
            background: #F8F6F3;
            font-weight: 600;
            color: var(--primary-dark);
        }

        tr:hover {
            background: var(--accent-light);
        }

        .status {
            padding: 4px 12px;
            border-radius: 60px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }

        .status-upcoming {
            background: #E3F2FD;
            color: #1976D2;
        }

        .status-completed {
            background: #E8F5E9;
            color: #2E7D32;
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            padding: 4px 8px;
            border-radius: 8px;
            transition: var(--transition);
        }

        .icon-btn.delete {
            color: var(--danger);
        }

        .icon-btn.delete:hover {
            background: #FFEBEE;
        }

        .icon-btn.edit {
            color: var(--warning);
        }

        .icon-btn.edit:hover {
            background: #FFF3E0;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 32px;
            padding: 32px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-content h3 {
            margin-bottom: 24px;
        }

        .modal-content input,
        .modal-content select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #E8E3DC;
            border-radius: 60px;
            margin-bottom: 16px;
            font-family: inherit;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .empty-state {
            text-align: center;
            padding: 48px;
            color: var(--text-medium);
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 16px;
            color: var(--accent-light);
        }

        .search-bar {
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
        }

        .search-bar input {
            flex: 1;
            padding: 12px 20px;
            border: 1px solid #E8E3DC;
            border-radius: 60px;
            font-family: inherit;
        }

        @media (max-width: 768px) {
            .container {
                padding: 0 20px;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            th, td {
                padding: 12px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

<header class="admin-header">
    <div class="container">
        <div class="admin-nav">
            <a href="index.html" class="logo">Blue<span>Clinik</span></a>
            <div style="display: flex; align-items: center; gap: 16px;">
                <span class="admin-badge"><i class="fas fa-shield-alt"></i> Администратор</span>
                <span id="adminName" style="font-weight: 500;"></span>
                <a href="dashboard.html" class="btn btn-outline">
                    <i class="fas fa-user"></i> Личный кабинет
                </a>
                <button onclick="logout()" class="btn btn-outline">
                    <i class="fas fa-sign-out-alt"></i> Выйти
                </button>
            </div>
        </div>
    </div>
</header>

<main class="admin-main">
    <div class="container">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-users"></i></div>
                <div class="stat-info">
                    <h3 id="totalUsers">0</h3>
                    <p>Всего клиентов</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-user-md"></i></div>
                <div class="stat-info">
                    <h3 id="totalMasters">0</h3>
                    <p>Косметологов</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-calendar-check"></i></div>
                <div class="stat-info">
                    <h3 id="totalAppointments">0</h3>
                    <p>Всего записей</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-ruble-sign"></i></div>
                <div class="stat-info">
                    <h3 id="totalRevenue">0</h3>
                    <p>Выручка (₽)</p>
                </div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="appointments"><i class="fas fa-calendar-check"></i> Записи</button>
            <button class="tab-btn" data-tab="users"><i class="fas fa-users"></i> Пользователи</button>
            <button class="tab-btn" data-tab="masters"><i class="fas fa-user-md"></i> Косметологи</button>
        </div>

        <div class="tab-pane active" id="appointmentsTab">
            <div class="search-bar">
                <input type="text" id="appointmentSearch" placeholder="Поиск по клиенту, услуге или врачу...">
            </div>
            <div class="data-table">
                <div id="appointmentsTableContainer"></div>
            </div>
        </div>

        <div class="tab-pane" id="usersTab">
            <div class="search-bar">
                <input type="text" id="userSearch" placeholder="Поиск по имени или email...">
            </div>
            <div class="data-table">
                <div id="usersTableContainer"></div>
            </div>
        </div>

        <div class="tab-pane" id="mastersTab">
            <div style="margin-bottom: 20px;">
                <button class="btn btn-primary" onclick="openAddMasterModal()">
                    <i class="fas fa-plus-circle"></i> Добавить косметолога
                </button>
            </div>
            <div class="data-table">
                <div id="mastersList"></div>
            </div>
        </div>
    </div>
</main>

<div id="editModal" class="modal">
    <div class="modal-content">
        <h3><i class="fas fa-edit"></i> Редактирование записи</h3>
        <input type="hidden" id="editAppointmentId">
        <input type="hidden" id="editUserId">
        <input type="text" id="editService" placeholder="Услуга">
        <input type="date" id="editDate">
        <input type="time" id="editTime">
        <input type="text" id="editDoctor" placeholder="Врач">
        <div class="modal-buttons">
            <button class="btn btn-primary" onclick="saveAppointmentEdit()">Сохранить</button>
            <button class="btn btn-outline" onclick="closeModal()">Отмена</button>
        </div>
    </div>
</div>

<div id="addMasterModal" class="modal">
    <div class="modal-content">
        <h3><i class="fas fa-user-md"></i> Добавить косметолога</h3>
        <input type="text" id="masterFullname" placeholder="ФИО">
        <input type="email" id="masterEmail" placeholder="Email">
        <input type="tel" id="masterPhone" placeholder="Телефон">
        <input type="password" id="masterPassword" placeholder="Пароль (мин. 6 символов)">
        <input type="text" id="masterSpecialization" placeholder="Специализация">
        <div class="modal-buttons">
            <button class="btn btn-primary" onclick="addMaster()">Добавить</button>
            <button class="btn btn-outline" onclick="closeAddMasterModal()">Отмена</button>
        </div>
    </div>
</div>

<script src="auth.js"></script>
<script>
    const currentUser = getCurrentUser();
    
    function checkAdminAccess() {
        if (!currentUser) {
            window.location.href = 'login.html';
            return false;
        }
        
        const isAdminEmail = currentUser.email === 'yusupova25@yandex.ru';
        const hasAdminFlag = currentUser.isAdmin === true;
        
        if (!isAdminEmail && !hasAdminFlag) {
            alert('Доступ запрещён. Только для администраторов.');
            window.location.href = 'dashboard.html';
            return false;
        }
        
        document.getElementById('adminName').textContent = currentUser.fullname;
        return true;
    }
    
    if (!checkAdminAccess()) {
        throw new Error('Access denied');
    }
    
    function getAllUsers() {
        return JSON.parse(localStorage.getItem('blueclinik_users') || '[]');
    }
    
    function saveAllUsers(users) {
        localStorage.setItem('blueclinik_users', JSON.stringify(users));
    }
    
    function getAllMasters() {
        const users = getAllUsers();
        return users.filter(u => u.role === 'master');
    }
    
    function getAllAppointments() {
        const users = getAllUsers();
        const allAppointments = [];
        
        users.forEach(user => {
            // Пропускаем мастеров (они не должны быть клиентами)
            if (user.role === 'master') return;
            
            const userAppointments = JSON.parse(localStorage.getItem(`appointments_${user.id}`) || '[]');
            userAppointments.forEach(apt => {
                allAppointments.push({
                    ...apt,
                    userId: user.id,
                    userFullname: user.fullname,
                    userEmail: user.email,
                    userPhone: user.phone
                });
            });
        });
        
        return allAppointments.sort((a, b) => new Date(b.date + 'T' + b.time) - new Date(a.date + 'T' + a.time));
    }
    
    function saveUserAppointments(userId, appointments) {
        localStorage.setItem(`appointments_${userId}`, JSON.stringify(appointments));
    }
    
    function updateStats() {
        const users = getAllUsers();
        const masters = getAllMasters();
        const appointments = getAllAppointments();
        
        const revenue = appointments.reduce((sum, apt) => sum + (apt.price || 0), 0);
        
        document.getElementById('totalUsers').textContent = users.filter(u => u.role === 'client').length;
        document.getElementById('totalMasters').textContent = masters.length;
        document.getElementById('totalAppointments').textContent = appointments.length;
        document.getElementById('totalRevenue').textContent = revenue.toLocaleString();
    }
    
    function formatDate(dateStr) {
        const months = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
        const [year, month, day] = dateStr.split('-');
        return `${parseInt(day)} ${months[parseInt(month) - 1]} ${year}`;
    }
    
    function renderAppointmentsTable(searchTerm = '') {
        let appointments = getAllAppointments();
        
        if (searchTerm) {
            const term = searchTerm.toLowerCase();
            appointments = appointments.filter(apt => 
                apt.userFullname?.toLowerCase().includes(term) ||
                apt.userEmail?.toLowerCase().includes(term) ||
                apt.service?.toLowerCase().includes(term) ||
                apt.masterName?.toLowerCase().includes(term)
            );
        }
        
        const container = document.getElementById('appointmentsTableContainer');
        const now = new Date();
        
        if (appointments.length === 0) {
            container.innerHTML = `<div class="empty-state"><i class="fas fa-calendar-times"></i><p>Записей не найдено</p></div>`;
            return;
        }
        
        let html = `<table><thead><tr>
            <th>Клиент</th><th>Услуга</th><th>Врач</th><th>Дата</th><th>Время</th><th>Стоимость</th><th>Статус</th><th>Действия</th>
        </tr></thead><tbody>`;
        
        appointments.forEach(apt => {
            const aptDateTime = new Date(apt.date + 'T' + apt.time);
            const isUpcoming = aptDateTime > now;
            const statusClass = isUpcoming ? 'status-upcoming' : 'status-completed';
            const statusText = isUpcoming ? 'Предстоит' : 'Завершена';
            
            html += `<tr>
                <td><strong>${apt.userFullname || '—'}</strong><br><small>${apt.userEmail || ''}</small></td>
                <td>${apt.service || '—'}</td>
                <td>${apt.masterName || apt.doctor || '—'}</td>
                <td>${formatDate(apt.date)}</td>
                <td>${apt.time}</td>
                <td>${(apt.price || 0).toLocaleString()} ₽</td>
                <td><span class="status ${statusClass}">${statusText}</span></td>
                <td class="action-btns">
                    <button class="icon-btn edit" onclick="openEditModal(${apt.id}, ${apt.userId})"><i class="fas fa-pen"></i></button>
                    <button class="icon-btn delete" onclick="deleteAppointment(${apt.id}, ${apt.userId})"><i class="fas fa-trash"></i></button>
                </td>
            </tr>`;
        });
        
        html += `</tbody></table>`;
        container.innerHTML = html;
    }
    
    function renderUsersTable(searchTerm = '') {
        let users = getAllUsers().filter(u => u.role === 'client');
        
        if (searchTerm) {
            const term = searchTerm.toLowerCase();
            users = users.filter(user => 
                user.fullname?.toLowerCase().includes(term) ||
                user.email?.toLowerCase().includes(term) ||
                user.phone?.toLowerCase().includes(term)
            );
        }
        
        const container = document.getElementById('usersTableContainer');
        
        if (users.length === 0) {
            container.innerHTML = `<div class="empty-state"><i class="fas fa-users-slash"></i><p>Пользователей не найдено</p></div>`;
            return;
        }
        
        let html = `<table><thead><tr><th>ID</th><th>ФИО</th><th>Email</th><th>Телефон</th><th>Дата регистрации</th><th>Записей</th><th>Действия</th></tr></thead><tbody>`;
        
        users.forEach(user => {
            const userAppointments = JSON.parse(localStorage.getItem(`appointments_${user.id}`) || '[]');
            const appointmentsCount = userAppointments.length;
            
            html += `<tr>
                <td>${user.id}</td>
                <td><strong>${user.fullname || '—'}</strong></td>
                <td>${user.email || '—'}</td>
                <td>${user.phone || '—'}</td>
                <td>${user.createdAt ? new Date(user.createdAt).toLocaleDateString('ru-RU') : '—'}</td>
                <td>${appointmentsCount}</td>
                <td class="action-btns">
                    <button class="icon-btn delete" onclick="deleteUser(${user.id})"><i class="fas fa-user-minus"></i></button>
                </td>
            </tr>`;
        });
        
        html += `</tbody></table>`;
        container.innerHTML = html;
    }
    
    function renderMastersTable() {
        const masters = getAllMasters();
        const container = document.getElementById('mastersList');
        
        if (masters.length === 0) {
            container.innerHTML = `<div class="empty-state"><i class="fas fa-user-md"></i><p>Косметологи не добавлены</p><button class="btn btn-primary" onclick="openAddMasterModal()">Добавить первого косметолога</button></div>`;
            return;
        }
        
        let html = `<table><thead><tr><th>ID</th><th>ФИО</th><th>Email</th><th>Телефон</th><th>Специализация</th><th>Дата добавления</th><th>Действия</th></tr></thead><tbody>`;
        
        masters.forEach(master => {
            html += `<tr>
                <td>${master.id}</td>
                <td><strong>${master.fullname}</strong></td>
                <td>${master.email}</td>
                <td>${master.phone || '—'}</td>
                <td>${master.specialization || '—'}</td>
                <td>${master.createdAt ? new Date(master.createdAt).toLocaleDateString('ru-RU') : '—'}</td>
                <td class="action-btns">
                    <button class="icon-btn delete" onclick="deleteMaster(${master.id})"><i class="fas fa-trash"></i></button>
                </td>
            </tr>`;
        });
        
        html += `</tbody></table>`;
        container.innerHTML = html;
    }
    
    function openAddMasterModal() {
        document.getElementById('addMasterModal').classList.add('active');
    }
    
    function closeAddMasterModal() {
        document.getElementById('addMasterModal').classList.remove('active');
        document.getElementById('masterFullname').value = '';
        document.getElementById('masterEmail').value = '';
        document.getElementById('masterPhone').value = '';
        document.getElementById('masterPassword').value = '';
        document.getElementById('masterSpecialization').value = '';
    }
    
    function addMaster() {
        const fullname = document.getElementById('masterFullname').value.trim();
        const email = document.getElementById('masterEmail').value.trim();
        const phone = document.getElementById('masterPhone').value.trim();
        const password = document.getElementById('masterPassword').value;
        const specialization = document.getElementById('masterSpecialization').value.trim();
        
        if (!fullname || !email || !phone || !password) {
            alert('Заполните все обязательные поля');
            return;
        }
        
        if (password.length < 6) {
            alert('Пароль должен быть не менее 6 символов');
            return;
        }
        
        const result = createMasterByAdmin(fullname, email, phone, password, specialization);
        
        if (result.success) {
            alert(`Косметолог ${fullname} успешно добавлен!`);
            closeAddMasterModal();
            renderMastersTable();
            updateStats();
        } else {
            alert('Ошибка: ' + result.error);
        }
    }
    
    function deleteMaster(masterId) {
        if (confirm('Вы уверены, что хотите удалить этого косметолога? Все его данные и расписание будут удалены.')) {
            const result = deleteMaster(masterId);
            if (result.success) {
                alert('Косметолог удален');
                renderMastersTable();
                updateStats();
            } else {
                alert('Ошибка: ' + result.error);
            }
        }
    }
    
    function openEditModal(appointmentId, userId) {
        const appointments = getAllAppointments();
        const appointment = appointments.find(apt => apt.id === appointmentId && apt.userId === userId);
        
        if (appointment) {
            document.getElementById('editAppointmentId').value = appointmentId;
            document.getElementById('editUserId').value = userId;
            document.getElementById('editService').value = appointment.service || '';
            document.getElementById('editDate').value = appointment.date || '';
            document.getElementById('editTime').value = appointment.time || '';
            document.getElementById('editDoctor').value = appointment.doctor || '';
            document.getElementById('editModal').classList.add('active');
        }
    }
    
    function saveAppointmentEdit() {
        const appointmentId = parseInt(document.getElementById('editAppointmentId').value);
        const userId = parseInt(document.getElementById('editUserId').value);
        const newService = document.getElementById('editService').value;
        const newDate = document.getElementById('editDate').value;
        const newTime = document.getElementById('editTime').value;
        const newDoctor = document.getElementById('editDoctor').value;
        
        let userAppointments = JSON.parse(localStorage.getItem(`appointments_${userId}`) || '[]');
        const index = userAppointments.findIndex(apt => apt.id === appointmentId);
        
        if (index !== -1) {
            userAppointments[index] = {
                ...userAppointments[index],
                service: newService,
                date: newDate,
                time: newTime,
                doctor: newDoctor
            };
            saveUserAppointments(userId, userAppointments);
            closeModal();
            renderAppointmentsTable(document.getElementById('appointmentSearch').value);
            updateStats();
            alert('Запись обновлена');
        }
    }
    
    function deleteAppointment(appointmentId, userId) {
        if (confirm('Удалить эту запись?')) {
            let userAppointments = JSON.parse(localStorage.getItem(`appointments_${userId}`) || '[]');
            userAppointments = userAppointments.filter(apt => apt.id !== appointmentId);
            saveUserAppointments(userId, userAppointments);
            renderAppointmentsTable(document.getElementById('appointmentSearch').value);
            updateStats();
            alert('Запись удалена');
        }
    }
    
    function deleteUser(userId) {
        const user = getAllUsers().find(u => u.id === userId);
        if (!user) return;
        
        if (confirm(`Удалить пользователя "${user.fullname}"? Все его записи также будут удалены.`)) {
            localStorage.removeItem(`appointments_${userId}`);
            
            let users = getAllUsers();
            users = users.filter(u => u.id !== userId);
            saveAllUsers(users);
            
            renderUsersTable(document.getElementById('userSearch').value);
            updateStats();
            alert('Пользователь удалён');
        }
    }
    
    function closeModal() {
        document.getElementById('editModal').classList.remove('active');
    }
    
    function initTabs() {
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));
                document.getElementById(`${btn.dataset.tab}Tab`).classList.add('active');
                
                if (btn.dataset.tab === 'users') {
                    renderUsersTable(document.getElementById('userSearch').value);
                } else if (btn.dataset.tab === 'masters') {
                    renderMastersTable();
                } else {
                    renderAppointmentsTable(document.getElementById('appointmentSearch').value);
                }
            });
        });
    }
    
    function initSearch() {
        const appointmentSearch = document.getElementById('appointmentSearch');
        const userSearch = document.getElementById('userSearch');
        
        appointmentSearch.addEventListener('input', () => {
            renderAppointmentsTable(appointmentSearch.value);
        });
        
        userSearch.addEventListener('input', () => {
            renderUsersTable(userSearch.value);
        });
    }
    
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeModal();
    });
    
    function init() {
        initTabs();
        initSearch();
        updateStats();
        renderAppointmentsTable('');
        renderUsersTable('');
        renderMastersTable();
    }
    
    init();
</script>
</body>
</html>
