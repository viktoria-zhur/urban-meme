<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запись онлайн | BlueClinik</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-page: #F4F2EF; --card-bg: #FFFFFF; --primary-dark: #0A1C2F;
            --primary-medium: #1F3E5C; --accent: #C89F9F; --accent-light: #F1E6E6;
            --text-dark: #1A2C3A; --text-medium: #5D6F7F; --shadow: 0 8px 28px -6px rgba(0,0,0,0.06);
            --shadow-hover: 0 20px 32px -12px rgba(0,0,0,0.12);
            --danger: #EF5350;
            --success: #4CAF50;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-page);
            color: var(--text-dark);
            padding: 40px 20px;
        }
        .container { max-width: 1280px; margin: 0 auto; }
        .header {
            background: var(--card-bg);
            border-radius: 32px;
            padding: 20px 32px;
            margin-bottom: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            box-shadow: var(--shadow);
        }
        .logo { font-size: 28px; font-weight: 700; text-decoration: none; color: var(--primary-dark); }
        .logo span { color: var(--accent); }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            font-weight: 500;
            border-radius: 60px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            font-size: 14px;
            text-decoration: none;
            font-family: inherit;
        }
        .btn-outline { background: transparent; border: 1.5px solid var(--primary-dark); color: var(--primary-dark); }
        .btn-outline:hover { background: var(--primary-dark); color: white; }
        .btn-primary { background: var(--primary-dark); color: white; }
        .btn-primary:hover { background: var(--primary-medium); transform: translateY(-2px); }
        .booking-card {
            background: var(--card-bg);
            border-radius: 32px;
            padding: 40px;
            box-shadow: var(--shadow-hover);
        }
        .booking-title { font-size: 32px; margin-bottom: 32px; text-align: center; }
        .booking-title i { color: var(--accent); margin-right: 12px; }
        .step { margin-bottom: 40px; border-bottom: 1px solid #E8E3DC; padding-bottom: 28px; }
        .step h3 { font-size: 22px; margin-bottom: 24px; color: var(--primary-dark); }
        .step h3 i { color: var(--accent); margin-right: 12px; }
        .masters-grid, .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
        }
        .master-card, .service-card {
            background: var(--bg-page);
            border-radius: 28px;
            cursor: pointer;
            transition: all 0.25s ease;
            border: 2px solid transparent;
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        .master-card.selected, .service-card.selected {
            border-color: var(--accent);
            background: white;
            box-shadow: var(--shadow-hover);
        }
        .master-img { height: 200px; overflow: hidden; }
        .master-img img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
        .master-card:hover .master-img img { transform: scale(1.03); }
        .master-info, .service-info { padding: 16px; text-align: center; }
        .master-name { font-weight: 700; font-size: 18px; margin-bottom: 6px; }
        .master-spec { font-size: 13px; color: var(--text-medium); }
        .service-icon { font-size: 48px; color: var(--accent); margin-bottom: 16px; }
        .service-name { font-weight: 700; font-size: 18px; margin-bottom: 8px; }
        .service-price { color: var(--accent); font-weight: 600; font-size: 16px; }
        .date-time-grid { display: flex; flex-wrap: wrap; gap: 30px; }
        .datepicker { flex: 1; min-width: 220px; }
        .time-slots { flex: 2; }
        .time-slots-grid { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
        .time-slot {
            background: var(--bg-page);
            padding: 10px 24px;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #E0D8D0;
            font-weight: 500;
        }
        .time-slot.selected { background: var(--primary-dark); color: white; border-color: var(--primary-dark); }
        input[type="date"] {
            padding: 14px 20px;
            border-radius: 60px;
            border: 1px solid #E0D8D0;
            font-family: inherit;
            width: 100%;
            font-size: 15px;
            background: var(--bg-page);
        }
        .btn-large { width: 100%; justify-content: center; margin-top: 12px; padding: 14px 32px; font-size: 16px; }
        .alert {
            padding: 16px 20px;
            border-radius: 60px;
            margin-bottom: 28px;
            display: none;
            align-items: center;
            gap: 12px;
        }
        .alert.show { display: flex; }
        .alert.error { background: #FFEBEE; color: var(--danger); }
        .alert.success { background: #E8F5E9; color: var(--success); }
        .loading { text-align: center; padding: 40px; color: var(--text-medium); }
        .loading i { font-size: 40px; margin-bottom: 12px; display: block; }
        @media (max-width: 768px) {
            .booking-card { padding: 24px; }
            .masters-grid, .services-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <a href="index.html" class="logo">Blue<span>Clinik</span></a>
        <div>
            <a href="dashboard.html" class="btn btn-outline"><i class="fas fa-user"></i> Личный кабинет</a>
        </div>
    </div>

    <div class="booking-card">
        <div class="booking-title">
            <i class="fas fa-calendar-check"></i> Онлайн-запись к косметологу
        </div>

        <div id="alertMessage" class="alert"></div>

        <div class="step">
            <h3><i class="fas fa-user-md"></i> 1. Выберите специалиста</h3>
            <div id="mastersList" class="masters-grid">
                <div class="loading"><i class="fas fa-spinner fa-spin"></i> Загрузка специалистов...</div>
            </div>
        </div>

        <div class="step" id="servicesStep" style="display: none;">
            <h3><i class="fas fa-spa"></i> 2. Выберите процедуру</h3>
            <div id="servicesList" class="services-grid"></div>
        </div>

        <div class="step" id="datetimeStep" style="display: none;">
            <h3><i class="far fa-clock"></i> 3. Удобные дата и время</h3>
            <div class="date-time-grid">
                <div class="datepicker">
                    <label><i class="fas fa-calendar-alt" style="color: var(--accent); margin-right: 8px;"></i> Дата приема:</label>
                    <input type="date" id="appointmentDate" min="">
                </div>
                <div class="time-slots">
                    <label><i class="fas fa-clock" style="color: var(--accent); margin-right: 8px;"></i> Доступное время:</label>
                    <div id="timeSlotsList" class="time-slots-grid"></div>
                </div>
            </div>
        </div>

        <button class="btn btn-primary btn-large" id="submitBookingBtn" style="display: none;">
            <i class="fas fa-check-circle"></i> Подтвердить запись
        </button>
    </div>
</div>

<script src="auth.js"></script>
<script>
    let masters = [];
    let services = {};
    let schedules = {};
    let selectedMaster = null;
    let selectedService = null;
    let selectedTime = null;
    let currentUser = null;

    const defaultImages = [
        'https://randomuser.me/api/portraits/women/68.jpg',
        'https://randomuser.me/api/portraits/women/65.jpg',
        'https://randomuser.me/api/portraits/women/44.jpg',
        'https://randomuser.me/api/portraits/women/90.jpg'
    ];

    const DEFAULT_SERVICES = [
        { name: 'SMAS-лифтинг Ultraformer', price: 50990, duration: 60 },
        { name: 'Биоревитализация REVI', price: 15990, duration: 45 },
        { name: 'RF-лифтинг лица', price: 6900, duration: 30 }
    ];

    const DEFAULT_SCHEDULE = {
        monday: { enabled: true, hours: ['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00'] },
        tuesday: { enabled: true, hours: ['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00'] },
        wednesday: { enabled: true, hours: ['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00'] },
        thursday: { enabled: true, hours: ['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00'] },
        friday: { enabled: true, hours: ['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00'] },
        saturday: { enabled: false, hours: [] },
        sunday: { enabled: false, hours: [] }
    };

    function showAlert(msg, type = 'success') {
        const alertDiv = document.getElementById('alertMessage');
        alertDiv.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-triangle'}"></i> ${msg}`;
        alertDiv.className = `alert show ${type}`;
        setTimeout(() => alertDiv.classList.remove('show'), 4000);
    }

    function setMinDate() {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('appointmentDate').min = today;
        document.getElementById('appointmentDate').value = today;
    }

    // Инициализация данных для мастера (если нет)
    function initMasterData(masterId) {
        if (!localStorage.getItem(`services_${masterId}`)) {
            localStorage.setItem(`services_${masterId}`, JSON.stringify(DEFAULT_SERVICES));
        }
        if (!localStorage.getItem(`schedule_${masterId}`)) {
            localStorage.setItem(`schedule_${masterId}`, JSON.stringify(DEFAULT_SCHEDULE));
        }
    }

    function loadAllData() {
        const allUsers = getUsers();
        masters = allUsers.filter(u => u.role === 'master');
        
        masters.forEach(master => {
            // Автоматически создаём услуги и расписание, если их нет
            initMasterData(master.id);
            
            const masterServices = localStorage.getItem(`services_${master.id}`);
            services[master.id] = masterServices ? JSON.parse(masterServices) : DEFAULT_SERVICES;
            
            const masterSchedule = localStorage.getItem(`schedule_${master.id}`);
            schedules[master.id] = masterSchedule ? JSON.parse(masterSchedule) : DEFAULT_SCHEDULE;
        });
        
        renderMasters();
    }

    function renderMasters() {
        const container = document.getElementById('mastersList');
        
        if (masters.length === 0) {
            container.innerHTML = '<div class="loading"><i class="fas fa-user-md"></i><br>Нет доступных специалистов</div>';
            return;
        }
        
        container.innerHTML = masters.map((master, index) => `
            <div class="master-card" data-id="${master.id}">
                <div class="master-img">
                    <img src="${defaultImages[index % defaultImages.length]}" alt="${master.fullname}">
                </div>
                <div class="master-info">
                    <div class="master-name">${escapeHtml(master.fullname)}</div>
                    <div class="master-spec">${escapeHtml(master.specialization || 'Косметолог')}</div>
                </div>
            </div>
        `).join('');
        
        document.querySelectorAll('.master-card').forEach(card => {
            card.addEventListener('click', () => {
                document.querySelectorAll('.master-card').forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                const id = parseInt(card.dataset.id);
                selectedMaster = masters.find(m => m.id === id);
                renderServices();
            });
        });
    }

    function renderServices() {
        const servicesContainer = document.getElementById('servicesList');
        const servicesStep = document.getElementById('servicesStep');
        
        if (!selectedMaster) return;
        
        const masterServices = services[selectedMaster.id] || [];
        
        if (masterServices.length === 0) {
            servicesContainer.innerHTML = '<div class="loading"><i class="fas fa-syringe"></i><br>Нет доступных услуг</div>';
            servicesStep.style.display = 'block';
            return;
        }
        
        servicesStep.style.display = 'block';
        
        servicesContainer.innerHTML = masterServices.map(service => `
            <div class="service-card" data-id="${service.id || Date.now()}" data-price="${service.price}" data-name="${escapeHtml(service.name)}">
                <div class="service-icon"><i class="${getServiceIcon(service.name)}"></i></div>
                <div class="service-info">
                    <div class="service-name">${escapeHtml(service.name)}</div>
                    <div class="service-price">${service.price.toLocaleString()} ₽</div>
                </div>
            </div>
        `).join('');
        
        document.querySelectorAll('.service-card').forEach(card => {
            card.addEventListener('click', () => {
                document.querySelectorAll('.service-card').forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                selectedService = {
                    id: parseInt(card.dataset.id),
                    name: card.dataset.name,
                    price: parseInt(card.dataset.price)
                };
                
                document.getElementById('datetimeStep').style.display = 'block';
                document.getElementById('submitBookingBtn').style.display = 'flex';
                
                const selectedDate = document.getElementById('appointmentDate').value;
                if (selectedDate) {
                    loadAvailableSlots(selectedDate);
                }
            });
        });
    }

    function getServiceIcon(serviceName) {
        if (serviceName.includes('SMAS')) return 'fas fa-arrow-up';
        if (serviceName.includes('Биоревитализация')) return 'fas fa-droplet';
        if (serviceName.includes('RF')) return 'fas fa-bolt';
        if (serviceName.includes('Лазерная')) return 'fas fa-lightbulb';
        if (serviceName.includes('Консультация')) return 'fas fa-stethoscope';
        return 'fas fa-spa';
    }

    function loadAvailableSlots(date) {
        if (!selectedMaster) return;
        
        const container = document.getElementById('timeSlotsList');
        const schedule = schedules[selectedMaster.id] || DEFAULT_SCHEDULE;
        
        const days = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'];
        const dayIndex = new Date(date).getDay();
        const dayName = days[dayIndex === 0 ? 6 : dayIndex - 1];
        const daySchedule = schedule[dayName];
        
        if (!daySchedule || !daySchedule.enabled || daySchedule.hours.length === 0) {
            container.innerHTML = '<div class="loading"><i class="fas fa-calendar-times"></i><br>В этот день специалист не работает</div>';
            return;
        }
        
        const appointmentsKey = `appointments_${selectedMaster.id}`;
        const masterAppointments = JSON.parse(localStorage.getItem(appointmentsKey) || '[]');
        const bookedTimes = masterAppointments.filter(apt => apt.date === date).map(apt => apt.time);
        
        const today = new Date().toISOString().split('T')[0];
        const currentHour = new Date().getHours();
        const currentMinute = new Date().getMinutes();
        
        let availableSlots = [...daySchedule.hours];
        
        if (date === today) {
            availableSlots = availableSlots.filter(time => {
                const [hour, minute] = time.split(':');
                if (parseInt(hour) > currentHour) return true;
                if (parseInt(hour) === currentHour && parseInt(minute) > currentMinute) return true;
                return false;
            });
        }
        
        availableSlots = availableSlots.filter(time => !bookedTimes.includes(time));
        
        if (availableSlots.length === 0) {
            container.innerHTML = '<div class="loading"><i class="fas fa-calendar-times"></i><br>Нет доступного времени</div>';
            return;
        }
        
        renderTimeSlots(availableSlots);
    }

    function renderTimeSlots(slots) {
        const container = document.getElementById('timeSlotsList');
        selectedTime = null;
        
        container.innerHTML = slots.map(time => `
            <div class="time-slot" data-time="${time}">${time}</div>
        `).join('');
        
        document.querySelectorAll('.time-slot').forEach(slot => {
            slot.addEventListener('click', () => {
                document.querySelectorAll('.time-slot').forEach(s => s.classList.remove('selected'));
                slot.classList.add('selected');
                selectedTime = slot.dataset.time;
            });
        });
    }

    // Обработка переноса записи
    function getRescheduleData() {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('reschedule')) {
            const rescheduleData = sessionStorage.getItem('rescheduleData');
            if (rescheduleData) {
                sessionStorage.removeItem('rescheduleData');
                return JSON.parse(rescheduleData);
            }
        }
        return null;
    }


    function createAppointment() {
        currentUser = getCurrentUser();
        
        if (!currentUser) {
            showAlert('Пожалуйста, войдите в аккаунт, чтобы записаться', 'error');
            setTimeout(() => { window.location.href = 'login.html'; }, 1500);
            return;
        }
        
        // Косметологи не могут записываться как клиенты
        if (currentUser.role === 'master') {
            showAlert('Косметологи не могут записываться на процедуры через эту форму. Обратитесь к администратору.', 'error');
            return;
        }

        // Проверка на перенос записи
        const rescheduleInfo = getRescheduleData();
        if (rescheduleInfo && rescheduleInfo.oldId) {
            // Удаляем старую запись у клиента
            const oldAppointmentsKey = `appointments_${currentUser.id}`;
            let oldAppointments = JSON.parse(localStorage.getItem(oldAppointmentsKey) || '[]');
            oldAppointments = oldAppointments.filter(apt => apt.id !== rescheduleInfo.oldId);
            localStorage.setItem(oldAppointmentsKey, JSON.stringify(oldAppointments));
            
            // Удаляем старую запись у мастера
            if (rescheduleInfo.masterId) {
                const masterAppointmentsKey = `appointments_${rescheduleInfo.masterId}`;
                let masterAppointments = JSON.parse(localStorage.getItem(masterAppointmentsKey) || '[]');
                masterAppointments = masterAppointments.filter(apt => apt.id !== rescheduleInfo.oldId);
                localStorage.setItem(masterAppointmentsKey, JSON.stringify(masterAppointments));
            }
            
            showAlert('Старая запись удалена. Создаётся новая...', 'success');
        }
        // ========================================

        const date = document.getElementById('appointmentDate').value;
        
        if (!selectedMaster) { showAlert('Выберите специалиста', 'error'); return; }
        if (!selectedService) { showAlert('Выберите услугу', 'error'); return; }
        if (!date) { showAlert('Выберите дату', 'error'); return; }
        if (!selectedTime) { showAlert('Выберите время', 'error'); return; }
        
        const today = new Date().toISOString().split('T')[0];
        if (date < today) { showAlert('Нельзя записаться на прошедшую дату', 'error'); return; }
        
        const appointmentKey = `appointments_${currentUser.id}`;
        const appointments = JSON.parse(localStorage.getItem(appointmentKey) || '[]');
        
        const isDuplicate = appointments.some(apt => 
            apt.masterId === selectedMaster.id && apt.date === date && apt.time === selectedTime
        );
        
        if (isDuplicate) {
            showAlert('Вы уже записаны на это время', 'error');
            return;
        }
        
        const newAppointment = {
            id: Date.now(),
            masterId: selectedMaster.id,
            masterName: selectedMaster.fullname,
            service: selectedService.name,
            price: selectedService.price,
            date: date,
            time: selectedTime,
            status: 'pending',
            createdAt: new Date().toISOString()
        };
        
        appointments.push(newAppointment);
        localStorage.setItem(appointmentKey, JSON.stringify(appointments));
        
        const masterAppointmentsKey = `appointments_${selectedMaster.id}`;
        const masterAppointments = JSON.parse(localStorage.getItem(masterAppointmentsKey) || '[]');
        masterAppointments.push({
            ...newAppointment,
            clientId: currentUser.id,
            clientName: currentUser.fullname,
            clientPhone: currentUser.phone
        });
        localStorage.setItem(masterAppointmentsKey, JSON.stringify(masterAppointments));
        
        showAlert('✅ Вы успешно записаны! Перенаправление в личный кабинет...', 'success');
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 2000);
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function initDateListener() {
        const dateInput = document.getElementById('appointmentDate');
        dateInput.addEventListener('change', function() {
            const selectedDate = this.value;
            const today = new Date().toISOString().split('T')[0];
            
            if (selectedDate < today) {
                showAlert('Нельзя записаться на прошедшую дату', 'error');
                this.value = today;
                loadAvailableSlots(today);
            } else {
                loadAvailableSlots(selectedDate);
            }
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        setMinDate();
        initDateListener();
        document.getElementById('submitBookingBtn').addEventListener('click', createAppointment);
        loadAllData();
    });
</script>
</body>
</html>
