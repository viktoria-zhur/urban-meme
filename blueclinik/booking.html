<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запись онлайн | BlueClinik</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-page: #F4F2EF; --card-bg: #FFFFFF; --primary-dark: #0A1C2F;
            --primary-medium: #1F3E5C; --accent: #C89F9F; --accent-light: #F1E6E6;
            --text-dark: #1A2C3A; --text-medium: #5D6F7F; --shadow: 0 8px 28px -6px rgba(0,0,0,0.06);
            --shadow-hover: 0 20px 32px -12px rgba(0,0,0,0.12);
            --danger: #EF5350;
            --success: #4CAF50;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-page);
            color: var(--text-dark);
            padding: 40px 20px;
        }
        .container {
            max-width: 1280px;
            margin: 0 auto;
        }
        .header {
            background: var(--card-bg);
            border-radius: 32px;
            padding: 20px 32px;
            margin-bottom: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            box-shadow: var(--shadow);
        }
        .logo {
            font-size: 28px;
            font-weight: 700;
            text-decoration: none;
            color: var(--primary-dark);
        }
        .logo span { color: var(--accent); }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            font-weight: 500;
            border-radius: 60px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            font-size: 14px;
            text-decoration: none;
            font-family: inherit;
        }
        .btn-outline {
            background: transparent;
            border: 1.5px solid var(--primary-dark);
            color: var(--primary-dark);
        }
        .btn-outline:hover {
            background: var(--primary-dark);
            color: white;
        }
        .btn-primary {
            background: var(--primary-dark);
            color: white;
        }
        .btn-primary:hover {
            background: var(--primary-medium);
            transform: translateY(-2px);
        }
        .booking-card {
            background: var(--card-bg);
            border-radius: 32px;
            padding: 40px;
            box-shadow: var(--shadow-hover);
        }
        .booking-title {
            font-size: 32px;
            margin-bottom: 32px;
            text-align: center;
        }
        .booking-title i {
            color: var(--accent);
            margin-right: 12px;
        }
        .step {
            margin-bottom: 40px;
            border-bottom: 1px solid #E8E3DC;
            padding-bottom: 28px;
        }
        .step h3 {
            font-size: 22px;
            margin-bottom: 24px;
            color: var(--primary-dark);
        }
        .step h3 i {
            color: var(--accent);
            margin-right: 12px;
        }
        .masters-grid, .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
        }
        .master-card {
            background: var(--bg-page);
            border-radius: 28px;
            cursor: pointer;
            transition: all 0.25s ease;
            border: 2px solid transparent;
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        .master-card.selected {
            border-color: var(--accent);
            background: white;
            box-shadow: var(--shadow-hover);
        }
        .master-img {
            height: 200px;
            overflow: hidden;
        }
        .master-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }
        .master-card:hover .master-img img {
            transform: scale(1.03);
        }
        .master-info {
            padding: 16px;
            text-align: center;
        }
        .master-name {
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 6px;
        }
        .master-spec {
            font-size: 13px;
            color: var(--text-medium);
        }
        .service-card {
            background: var(--bg-page);
            border-radius: 28px;
            cursor: pointer;
            transition: all 0.25s ease;
            border: 2px solid transparent;
            box-shadow: var(--shadow);
            text-align: center;
            padding: 28px 20px;
        }
        .service-card.selected {
            border-color: var(--accent);
            background: white;
            box-shadow: var(--shadow-hover);
        }
        .service-icon {
            font-size: 48px;
            color: var(--accent);
            margin-bottom: 16px;
        }
        .service-name {
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 8px;
        }
        .service-price {
            color: var(--accent);
            font-weight: 600;
            font-size: 16px;
        }
        .date-time-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
        }
        .datepicker {
            flex: 1;
            min-width: 220px;
        }
        .time-slots {
            flex: 2;
        }
        .time-slots-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 12px;
        }
        .time-slot {
            background: var(--bg-page);
            padding: 10px 24px;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #E0D8D0;
            font-weight: 500;
        }
        .time-slot.selected {
            background: var(--primary-dark);
            color: white;
            border-color: var(--primary-dark);
        }
        .time-slot.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #E8E3DC;
        }
        input[type="date"] {
            padding: 14px 20px;
            border-radius: 60px;
            border: 1px solid #E0D8D0;
            font-family: inherit;
            width: 100%;
            font-size: 15px;
            background: var(--bg-page);
        }
        .btn-large {
            width: 100%;
            justify-content: center;
            margin-top: 12px;
            padding: 14px 32px;
            font-size: 16px;
        }
        .alert {
            background: #E8F5E9;
            padding: 16px 20px;
            border-radius: 60px;
            margin-bottom: 28px;
            display: none;
            align-items: center;
            gap: 12px;
        }
        .alert.show {
            display: flex;
        }
        .alert.error {
            background: #FFEBEE;
            color: var(--danger);
        }
        .alert.success {
            background: #E8F5E9;
            color: var(--success);
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-medium);
        }
        .loading i {
            font-size: 40px;
            margin-bottom: 12px;
            display: block;
        }
        @media (max-width: 768px) {
            .booking-card { padding: 24px; }
            .masters-grid, .services-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <a href="index.html" class="logo">Blue<span>Clinik</span></a>
        <div>
            <a href="dashboard.html" class="btn btn-outline"><i class="fas fa-user"></i> Личный кабинет</a>
        </div>
    </div>

    <div class="booking-card">
        <div class="booking-title">
            <i class="fas fa-calendar-check"></i> Онлайн-запись к косметологу
        </div>

        <div id="alertMessage" class="alert"></div>

        <!-- Шаг 1: Выбор специалиста -->
        <div class="step">
            <h3><i class="fas fa-user-md"></i> 1. Выберите специалиста</h3>
            <div id="mastersList" class="masters-grid">
                <div class="loading"><i class="fas fa-spinner fa-spin"></i> Загрузка специалистов...</div>
            </div>
        </div>

        <!-- Шаг 2: Выбор услуги -->
        <div class="step" id="servicesStep" style="display: none;">
            <h3><i class="fas fa-spa"></i> 2. Выберите процедуру</h3>
            <div id="servicesList" class="services-grid"></div>
        </div>

        <!-- Шаг 3: Дата и время -->
        <div class="step" id="datetimeStep" style="display: none;">
            <h3><i class="far fa-clock"></i> 3. Удобные дата и время</h3>
            <div class="date-time-grid">
                <div class="datepicker">
                    <label>📅 Дата приема:</label>
                    <input type="date" id="appointmentDate" min="">
                </div>
                <div class="time-slots">
                    <label>⏰ Доступное время:</label>
                    <div id="timeSlotsList" class="time-slots-grid"></div>
                </div>
            </div>
        </div>

        <button class="btn btn-primary btn-large" id="submitBookingBtn" style="display: none;">
            <i class="fas fa-check-circle"></i> Подтвердить запись
        </button>
    </div>
</div>

<script src="auth.js"></script>
<script>
    // Переменные состояния
    let masters = [];
    let selectedMaster = null;
    let selectedService = null;
    let selectedTime = null;
    let currentUser = null;

    // Иконки для услуг
    const SERVICE_ICONS = {
        'Консультация': 'fas fa-stethoscope',
        'Чистка': 'fas fa-face-smile',
        'SMAS': 'fas fa-arrow-up',
        'Биоревитализация': 'fas fa-droplet',
        'RF-лифтинг': 'fas fa-bolt',
        'Лазерная': 'fas fa-lightbulb',
        'Ботокс': 'fas fa-syringe',
        'default': 'fas fa-spa'
    };

    function getServiceIcon(serviceName) {
        for (const [key, icon] of Object.entries(SERVICE_ICONS)) {
            if (serviceName.includes(key)) return icon;
        }
        return SERVICE_ICONS.default;
    }

    // Показать уведомление
    function showAlert(msg, type = 'success') {
        const alertDiv = document.getElementById('alertMessage');
        alertDiv.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-triangle'}"></i> ${msg}`;
        alertDiv.className = `alert show ${type}`;
        setTimeout(() => alertDiv.classList.remove('show'), 4000);
    }

    // Установка минимальной даты (сегодня)
    function setMinDate() {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('appointmentDate').min = today;
        document.getElementById('appointmentDate').value = today;
    }

    // Загрузка специалистов с сервера
    async function loadMasters() {
        const container = document.getElementById('mastersList');
        try {
            const response = await fetch('api_get_masters.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({})
            });
            const data = await response.json();
            
            if (data.success && data.masters && data.masters.length > 0) {
                masters = data.masters;
                renderMasters();
            } else {
                container.innerHTML = '<div class="loading"><i class="fas fa-user-md"></i><br>Нет доступных специалистов</div>';
            }
        } catch (error) {
            console.error('Ошибка загрузки мастеров:', error);
            container.innerHTML = '<div class="loading"><i class="fas fa-exclamation-triangle"></i><br>Ошибка загрузки специалистов</div>';
        }
    }

    // Отображение списка специалистов
    function renderMasters() {
        const container = document.getElementById('mastersList');
        
        // Для демонстрации используем фото из randomuser.me
        const defaultImages = [
            'https://randomuser.me/api/portraits/women/68.jpg',
            'https://randomuser.me/api/portraits/women/65.jpg',
            'https://randomuser.me/api/portraits/women/44.jpg',
            'https://randomuser.me/api/portraits/women/90.jpg'
        ];
        
        container.innerHTML = masters.map((master, index) => `
            <div class="master-card" data-id="${master.id}">
                <div class="master-img">
                    <img src="${defaultImages[index % defaultImages.length]}" alt="${master.fullname}">
                </div>
                <div class="master-info">
                    <div class="master-name">${escapeHtml(master.fullname)}</div>
                    <div class="master-spec">${escapeHtml(master.specialization || 'Косметолог')}</div>
                </div>
            </div>
        `).join('');
        
        // Добавляем обработчики клика
        document.querySelectorAll('.master-card').forEach(card => {
            card.addEventListener('click', () => {
                document.querySelectorAll('.master-card').forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                const id = parseInt(card.dataset.id);
                selectedMaster = masters.find(m => m.id === id);
                loadServices(selectedMaster.id);
            });
        });
    }

    // Загрузка услуг выбранного мастера
    async function loadServices(masterId) {
        const servicesContainer = document.getElementById('servicesList');
        const servicesStep = document.getElementById('servicesStep');
        
        servicesContainer.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Загрузка услуг...</div>';
        servicesStep.style.display = 'block';
        
        try {
            const response = await fetch('api_get_master_services.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ masterId: masterId })
            });
            const data = await response.json();
            
            if (data.success && data.services && data.services.length > 0) {
                renderServices(data.services);
            } else {
                servicesContainer.innerHTML = '<div class="loading"><i class="fas fa-syringe"></i><br>Нет доступных услуг</div>';
            }
        } catch (error) {
            console.error('Ошибка загрузки услуг:', error);
            servicesContainer.innerHTML = '<div class="loading"><i class="fas fa-exclamation-triangle"></i><br>Ошибка загрузки услуг</div>';
        }
    }

    // Отображение списка услуг
    function renderServices(services) {
        const container = document.getElementById('servicesList');
        
        container.innerHTML = services.map(service => `
            <div class="service-card" data-id="${service.id}" data-price="${service.price}" data-name="${escapeHtml(service.name)}">
                <div class="service-icon"><i class="${getServiceIcon(service.name)}"></i></div>
                <div class="service-name">${escapeHtml(service.name)}</div>
                <div class="service-price">${service.price.toLocaleString()} ₽</div>
            </div>
        `).join('');
        
        document.querySelectorAll('.service-card').forEach(card => {
            card.addEventListener('click', () => {
                document.querySelectorAll('.service-card').forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                selectedService = {
                    id: parseInt(card.dataset.id),
                    name: card.dataset.name,
                    price: parseInt(card.dataset.price)
                };
                
                // Показываем шаг с датой и временем
                document.getElementById('datetimeStep').style.display = 'block';
                document.getElementById('submitBookingBtn').style.display = 'flex';
                
                // Обновляем доступное время при смене услуги
                const selectedDate = document.getElementById('appointmentDate').value;
                if (selectedDate) {
                    loadAvailableSlots(selectedDate);
                }
            });
        });
    }

    // Загрузка доступных слотов
    async function loadAvailableSlots(date) {
        if (!selectedMaster) return;
        
        const container = document.getElementById('timeSlotsList');
        container.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Загрузка времени...</div>';
        selectedTime = null;
        
        try {
            const response = await fetch('api_get_available_slots.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ masterId: selectedMaster.id, date: date })
            });
            const data = await response.json();
            
            if (data.success && data.slots && data.slots.length > 0) {
                renderTimeSlots(data.slots);
            } else if (data.error) {
                container.innerHTML = `<div class="loading"><i class="fas fa-ban"></i><br>${data.error}</div>`;
            } else {
                container.innerHTML = '<div class="loading"><i class="fas fa-calendar-times"></i><br>Нет доступного времени на выбранную дату</div>';
            }
        } catch (error) {
            console.error('Ошибка загрузки слотов:', error);
            container.innerHTML = '<div class="loading"><i class="fas fa-exclamation-triangle"></i><br>Ошибка загрузки времени</div>';
        }
    }

    // Отображение доступных слотов
    function renderTimeSlots(slots) {
        const container = document.getElementById('timeSlotsList');
        
        container.innerHTML = slots.map(time => `
            <div class="time-slot" data-time="${time}">${time}</div>
        `).join('');
        
        document.querySelectorAll('.time-slot').forEach(slot => {
            slot.addEventListener('click', () => {
                document.querySelectorAll('.time-slot').forEach(s => s.classList.remove('selected'));
                slot.classList.add('selected');
                selectedTime = slot.dataset.time;
            });
        });
    }

    // Создание записи
    async function createAppointment() {
        const currentUser = getCurrentUser();
        
        if (!currentUser) {
            showAlert('Пожалуйста, войдите в аккаунт, чтобы записаться', 'error');
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1500);
            return false;
        }
        
        const date = document.getElementById('appointmentDate').value;
        
        if (!selectedMaster) {
            showAlert('Выберите специалиста', 'error');
            return false;
        }
        if (!selectedService) {
            showAlert('Выберите услугу', 'error');
            return false;
        }
        if (!date) {
            showAlert('Выберите дату', 'error');
            return false;
        }
        if (!selectedTime) {
            showAlert('Выберите время', 'error');
            return false;
        }
        
        // Проверка даты
        const today = new Date().toISOString().split('T')[0];
        if (date < today) {
            showAlert('Нельзя записаться на прошедшую дату', 'error');
            return false;
        }
        
        showAlert('Создание записи...', 'success');
        
        try {
            const response = await fetch('api_create_appointment.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    clientId: currentUser.id,
                    masterId: selectedMaster.id,
                    serviceName: selectedService.name,
                    servicePrice: selectedService.price,
                    date: date,
                    time: selectedTime
                })
            });
            const data = await response.json();
            
            if (data.success) {
                showAlert('✅ Вы успешно записаны! Перенаправление в личный кабинет...', 'success');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 2000);
            } else {
                showAlert(data.error || 'Ошибка при создании записи', 'error');
            }
        } catch (error) {
            console.error('Ошибка:', error);
            showAlert('Ошибка сервера. Попробуйте позже.', 'error');
        }
        return true;
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // Обработчик изменения даты
    function initDateListener() {
        const dateInput = document.getElementById('appointmentDate');
        dateInput.addEventListener('change', function() {
            const selectedDate = this.value;
            const today = new Date().toISOString().split('T')[0];
            
            if (selectedDate < today) {
                showAlert('Нельзя записаться на прошедшую дату', 'error');
                this.value = today;
                loadAvailableSlots(today);
            } else {
                loadAvailableSlots(selectedDate);
            }
        });
    }

    // Проверка авторизации при загрузке
    function checkAuth() {
        currentUser = getCurrentUser();
        if (!currentUser) {
            // Не авторизован, но всё равно показываем страницу
            // При попытке записи будет перенаправление
            console.log('Пользователь не авторизован');
        }
    }

    // Инициализация
    document.addEventListener('DOMContentLoaded', () => {
        checkAuth();
        loadMasters();
        setMinDate();
        initDateListener();
        
        document.getElementById('submitBookingBtn').addEventListener('click', createAppointment);
    });
</script>
</body>
</html>
